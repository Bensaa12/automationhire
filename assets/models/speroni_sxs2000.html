const bin = atob(b64);
const buf = new Uint8Array(bin.length);
for (let i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i);

const geo = new STLLoader().parse(buf.buffer);
geo.computeBoundingBox();

const bb  = geo.boundingBox;
const ctr = new THREE.Vector3();
bb.getCenter(ctr);
geo.translate(-ctr.x, -ctr.y, -ctr.z);   // centre on origin

const sz = new THREE.Vector3();
bb.getSize(sz);
const maxSz = Math.max(sz.x, sz.y, sz.z);

// ── Material ───────────────────────────────────────────────────────────────
const mat = new THREE.MeshPhysicalMaterial({
  color:      0xbec8cc,
  metalness:  0.75,
  roughness:  0.22,
  reflectivity: 0.80,
  clearcoat:  0.20,
  clearcoatRoughness: 0.10,
});

scene.add(new THREE.Mesh(geo, mat));

// Position grid at model bottom
grid.position.y = -sz.y / 2;

// ── Fit camera ─────────────────────────────────────────────────────────────
const dist = maxSz * 1.9;
cam.position.set(dist, dist * 0.65, dist);
cam.near = maxSz * 0.001;
cam.far  = maxSz * 30;
cam.updateProjectionMatrix();
ctrl.target.set(0, 0, 0);
ctrl.update();

// ── HUD ────────────────────────────────────────────────────────────────────
document.getElementById('dimtxt').textContent =
  `${sz.x.toFixed(1)} × ${sz.y.toFixed(1)} × ${sz.z.toFixed(1)} mm`;

// ── Render loop ────────────────────────────────────────────────────────────
addEventListener('resize', () => {
  cam.aspect = innerWidth / innerHeight;
  cam.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

(function loop() {
  requestAnimationFrame(loop);
  ctrl.update();
  renderer.render(scene, cam);
})();
</script>
